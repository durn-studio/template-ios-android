# Railway configuration for the api-server service.
# Point the service's Root Directory at the repo root (the default); Railway
# will pick up this file and use the specified Dockerfile.
#
# Required env vars on the service:
#   DATABASE_URL   - link from the Postgres plugin (Railway injects this)
#   CORS_ORIGINS   - comma-separated list of allowed origins (or "*")
#
# Railway auto-injects PORT. Health checks target /api/healthz.

[build]
builder = "DOCKERFILE"
dockerfilePath = "artifacts/api-server/Dockerfile"

[deploy]
healthcheckPath = "/api/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
