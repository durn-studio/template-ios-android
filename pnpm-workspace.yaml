# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# This setting requires that any npm package version must have been published
# for at least 1 day (1440 minutes) before pnpm will allow installing it.
# This is a critical defense against supply-chain attacks. In most cases,
# malicious npm releases are discovered and pulled within hours, so a 1-day
# delay provides a strong safety buffer.
#
# DO NOT DISABLE THIS SETTING. Removing or setting it to 0 is considered
# extremely dangerous and leaves the entire workspace vulnerable to supply-
# chain attacks, which have been the #1 vector for npm ecosystem compromises.
#
# If you absolutely need to install a package before the 1-day window has
# passed (e.g. an urgent security bugfix), add it to a
# `minimumReleaseAgeExclude` allowlist. Only consider doing this for packages
# released by trusted organizations with an impeccable security posture (e.g.
# react from Meta, typescript from Microsoft). Remove the exclusion once the
# 1-day window has passed.
#
# Example:
#   minimumReleaseAgeExclude:
#     - react
#     - typescript
#
# ============================================================================
minimumReleaseAge: 1440

packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ~19.1.10
  '@types/react-dom': ~19.1.7
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.1
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  # Must be this exact version because expo requires it
  react: 19.1.0
  # Must be this exact version because expo requires it
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.0
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # Pin react-native-worklets everywhere so no transitive dep resolves to a
  # newer version than the worklets native module baked into the user's
  # Expo Go SDK 54 binary. Without this pin, some pnpm resolutions produce
  # a second orphaned copy at 0.8.1 in node_modules/.pnpm/, whose Babel
  # plugin leaks into Metro's transform and stamps `__pluginVersion = "0.8.1"`
  # on worklet functions — yielding either the JS vs Babel version mismatch
  # or an `Exception in HostFunction` depending on which side wins.
  #
  # NOTE (removed overrides): we used to pin
  #   "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  #   esbuild: "0.27.3"
  # to work around drizzle-kit pulling a vulnerable esbuild transitively.
  # Dropped because EAS Cloud's pnpm normalises the `npm:` alias syntax
  # differently from pnpm 10 locally, triggering
  # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH on `--frozen-lockfile`. Only
  # lib/db uses drizzle-kit and it's never built in the Expo pipeline,
  # so the security concern is confined to the API Railway image — can
  # re-pin inside lib/db's own package.json (pnpm.overrides) if needed.
  react-native-worklets: "0.5.1"